name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Validate adapters
        run: |
          cargo build
          fail=0
          for f in adapters/*.yaml; do
            if ! ./target/debug/anycli validate "$f"; then
              fail=1
            fi
          done
          exit $fail
