name: dictionary
description: "Free Dictionary — word definitions and synonyms"
base_url: "https://api.dictionaryapi.dev/api/v2/entries/en"
version: "1.1.0"
aliases: ["dict"]
tags: ["reference"]

commands:
  search:
    description: "Search for word definitions"
    url: "/{word}"
    format: json
    fields:
      word:
        json_path: "word"
      phonetic:
        json_path: "phonetic"
        alt_paths: ["phonetics[0].text"]
        default: ""
      part_of_speech:
        json_path: "meanings[0].partOfSpeech"
        default: ""
      definition:
        json_path: "meanings[0].definitions[0].definition"
      example:
        json_path: "meanings[0].definitions[0].example"
        default: ""
      synonyms:
        json_path: "meanings[0].synonyms"
        transform: join
    params:
      word:
        type: string
        required: true
        positional: true
        description: "Word to look up"
