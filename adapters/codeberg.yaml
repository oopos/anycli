name: codeberg
description: "Codeberg — search public Forgejo repositories"
base_url: "https://codeberg.org/api/v1"
version: "1.0.0"
tags: ["code"]

commands:
  search:
    description: "Search Codeberg repositories"
    url: "/repos/search?q={query}&limit={limit}&sort=stars"
    format: json
    selector: "data"
    headers:
      User-Agent: "anycli/0.2.5 (https://github.com/oopos/anycli)"
    fields:
      name:
        json_path: "full_name"
      description:
        json_path: "description"
        default: ""
      stars:
        json_path: "stars_count"
      forks:
        json_path: "forks_count"
        default: ""
      url:
        json_path: "html_url"
    params:
      query:
        type: string
        required: true
        positional: true
        description: "Search keyword"
      limit:
        type: integer
        default: 10
        description: "Number of results"
