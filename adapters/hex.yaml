name: hex
description: "Hex.pm — search Elixir/Erlang packages"
base_url: "https://hex.pm/api"
version: "1.0.0"
aliases: ["hexpm"]
tags: ["packages", "elixir"]

commands:
  search:
    description: "Search Hex packages"
    url: "/packages?search={query}&sort=recent_downloads"
    format: json
    fields:
      name:
        json_path: "name"
      description:
        json_path: "meta.description"
        default: ""
      version:
        json_path: "releases[0].version"
        default: ""
      downloads:
        json_path: "downloads.recent"
        alt_paths: ["downloads.all"]
        default: ""
      url:
        template: "https://hex.pm/packages/{name}"
    params:
      query:
        type: string
        required: true
        positional: true
        description: "Search keyword"
      limit:
        type: integer
        default: 10
        description: "Number of results"
