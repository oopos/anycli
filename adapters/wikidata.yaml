name: wikidata
description: "Wikidata — search entities"
base_url: "https://www.wikidata.org"
version: "1.0.0"
aliases: ["wd"]
tags: ["search", "knowledge"]

commands:
  search:
    description: "Search Wikidata entities"
    url: "/w/api.php?action=wbsearchentities&search={query}&language={lang}&limit={limit}&format=json"
    format: json
    selector: "search"
    fields:
      id:
        json_path: "id"
      label:
        json_path: "label"
      description:
        json_path: "description"
        default: ""
      url:
        json_path: "concepturi"
    params:
      query:
        type: string
        required: true
        positional: true
        description: "Search query"
      lang:
        type: string
        default: "en"
        description: "Language code (en, zh, ja, ...)"
      limit:
        type: integer
        default: 10
        description: "Number of results"
