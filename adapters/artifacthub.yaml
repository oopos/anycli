name: artifacthub
description: "Artifact Hub — search Helm charts and other packages"
base_url: "https://artifacthub.io/api/v1"
version: "1.0.0"
aliases: ["helm", "ah"]
tags: ["packages", "kubernetes"]

commands:
  search:
    description: "Search Artifact Hub packages"
    url: "/packages/search?ts_query_web={query}&limit={limit}"
    format: json
    selector: "packages"
    fields:
      name:
        json_path: "name"
      description:
        json_path: "description"
        default: ""
      version:
        json_path: "version"
      app_version:
        json_path: "app_version"
        default: ""
      stars:
        json_path: "stars"
      repository:
        json_path: "repository.name"
        alt_paths: ["repository.display_name"]
        default: ""
    params:
      query:
        type: string
        required: true
        positional: true
        description: "Search keyword"
      limit:
        type: integer
        default: 10
        description: "Number of results"
